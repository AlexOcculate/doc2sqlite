  NAME: DBs/MAIN.db

  CLIARG:
    SHORT_HAND: pi
    DEFAULT: true

  DDL:
    DROP: |
      DROP TABLE IF EXISTS
      PAGE_IMAGE

    CREATE: |
      CREATE TABLE IF NOT EXISTS
      PAGE_IMAGE
      ( PAGE_PHYSICAL_NUMBER    INTEGER NOT NULL
      , XREF           INTEGER NOT NULL
      , SMASK          INTEGER
      , WIDTH          INTEGER NOT NULL
      , HEIGHT         INTEGER NOT NULL
      , BPC            INTEGER NOT NULL
      , COLORSPACE     TEXT NOT NULL
      , ALT_COLORSPACE TEXT
      , NAME           TEXT
      , FILTER         TEXT
      , REFERENCER     INTEGER
      , EXT_           TEXT
      , SMASK_         INTEGER
      , WIDTH_         INTEGER
      , HEIGHT_        INTEGER
      , COLORSPACE_    INTEGER
      , CS_NAME_       TEXT
      , XRES_          INTEGER
      , YRES_          INTEGER
      , IMAGE_         BLOB
      )

  DML:
    INSERT: |
      INSERT INTO 
      PAGE_IMAGE
      ( PAGE_PHYSICAL_NUMBER
      , XREF
      , SMASK
      , WIDTH
      , HEIGHT
      , BPC
      , COLORSPACE
      , ALT_COLORSPACE
      , NAME
      , FILTER
      , REFERENCER
      , EXT_
      , SMASK_
      , WIDTH_
      , HEIGHT_
      , COLORSPACE_
      , CS_NAME_
      , XRES_
      , YRES_
      , IMAGE_
      )
      VALUES 
      ( ?, ?, ?, ?, ?
      , ?, ?, ?, ?, ?
      , ?, ?, ?, ?, ?
      , ?, ?, ?, ?, ?
      )

  DQL: null

  SCRIPT:
    APPEND: |
      # Clean up the page contents to ensure accurate image extraction.
      if page.number > 0:
          page.clean_contents()

      # list[dict] = [
      #    (
      #       xref, smask, width, height, bpc,
      #       colorspace, alt_colorspace,
      #       name, filter, referencer
      #    )
      # ]
      img_list: str = page.get_images(full=True)
      for img_info in img_list:
          xref = img_info[0]  # image object number
          #
          xtract_img = page.parent.extract_image(xref)
          #
          ext_ = xtract_img.get("ext")  # image type/extension
          smask_ = xtract_img.get("smask")  # xref of soft-mask image
          width_ = xtract_img.get("width")  # image width
          height_ = xtract_img.get("height")  # image height
          colorspace_ = xtract_img.get("colorspace")  # colorspace number
          cs_name_ = xtract_img.get("cs-name")  # colorspace name
          xres_ = xtract_img.get("xres")  # x resolution
          yres_ = xtract_img.get("yres")  # y resolution
          image_data_ = xtract_img.get("image")  # image bytes
          smask = img_info[1]  # soft-mask image object number
          width = img_info[2]  # image width
          height = img_info[3]  # image height
          bpc = img_info[4]  # bits per component
          colorspace = img_info[5]  # colorspace name
          alt_colorspace = img_info[6]  # alternate colorspace
          name = img_info[7]  # symbolic image name
          filter = img_info[8]  # decode filter
          referencer = (
              img_info[9] if len(img_info) > 9 else None
          )  # xref of referencer
          entry = (
              page.number,  # PAGE_NUMBER
              xref,  # XREF
              smask,  # SMASK
              width,  # WIDTH
              height,  # HEIGHT
              bpc,  # BPC
              colorspace,  # COLORSPACE
              alt_colorspace,  # ALT_COLORSPACE
              name,  # NAME
              filter,  # FILTER
              referencer,  # REFERENCER
              ext_,  # EXT_
              smask_ if smask != smask_ else None,  # SMASK_
              width_ if width != width_ else None,  # WIDTH_
              height_ if height != height_ else None,  # HEIGHT_
              colorspace_ if colorspace != colorspace_ else None,  # COLORSPACE_
              cs_name_,  # CS_NAME_
              xres_,  # XRES_
              yres_,  # YRES_
              image_data_,  # IMAGE_
          )

          self.data.append(entry)

      pass

PageAnnotation:
  NAME: DBs/MAIN.db

  CLIARG:
    SHORT_HAND: pa
    DEFAULT: true

  DDL:
    DROP: |
      DROP TABLE IF EXISTS
      PAGE_ANNOTATION

    CREATE: |
      CREATE TABLE IF NOT EXISTS
      PAGE_ANNOTATION
      ( PAGE_PHYSICAL_NUMBER INTEGER NOT NULL
      , COUNTER     INTEGER 
      , TYPE        TEXT
      , APN_BBOX    TEXT
      , APB_MATRIX  TEXT
      , BLENDMODE   TEXT
      , COLORS      TEXT
      , FLAGS       INTEGER
      , HAS_POPUP   BOOLEAN
      , IS_OPEN     BOOLEAN
      , INFO        TEXT
      , IRT_XREF    TEXT
      , LANGUAGE    TEXT
      , LINE_ENDS   TEXT
      , POPUP_RECT  TEXT
      , POPUP_XREF  TEXT
      , RECT        TEXT
      , ROTATION    TEXT
      , OPACITY     TEXT
      , RECT_DELTA  TEXT
      , VERTICES    TEXT
      , XREF        TEXT
      , IMAGE       BLOB
      )

  DML:
    INSERT: |
      INSERT INTO 
      PAGE_ANNOTATION
      ( PAGE_PHYSICAL_NUMBER
      , COUNTER
      , TYPE
      , APN_BBOX
      , APB_MATRIX
      , BLENDMODE
      , COLORS
      , FLAGS
      , HAS_POPUP
      , IS_OPEN
      , INFO
      , IRT_XREF
      , LANGUAGE
      , LINE_ENDS
      , POPUP_RECT
      , POPUP_XREF
      , RECT
      , ROTATION
      , OPACITY
      , RECT_DELTA
      , VERTICES
      , XREF
      , IMAGE
      )
      VALUES 
      ( ?, ?, ?, ?, ?
      , ?, ?, ?, ?, ? 
      , ?, ?, ?, ?, ? 
      , ?, ?, ?, ?, ? 
      , ?, ?, ?
      )

  DQL: null

  SCRIPT:
    APPEND: |
      # Clean up the page contents to ensure accurate image extraction.
      page.clean_contents()

      counter = 0

      for annot in page.annots():

          if annot is None:
              continue

          counter += 1

          # annot_parent = annot.parent
          # annot_next = annot.next

          # Render page to a Pixmap, clipped to table rect
          pix = page.get_pixmap(matrix=annot.apn_matrix, clip=annot.rect)

          entry = (
              page.number,
              counter,
              str(annot.type),
              str(annot.apn_bbox),
              str(annot.apn_matrix),
              str(annot.blendmode),
              str(annot.colors),
              # annot_file_info = annot.file_info
              str(annot.flags),
              str(annot.has_popup),
              str(annot.is_open),
              str(json.dumps(annot.info)),
              str(annot.irt_xref),
              str(annot.language),
              str(annot.line_ends),
              str(annot.popup_rect),
              str(annot.popup_xref),
              str(annot.rect),
              str(annot.rotation),
              str(annot.opacity),
              str(annot.rect_delta),
              str(annot.vertices),
              str(annot.xref),
              pix.tobytes(),  # BLOB
          )

          self.data.append(entry)

      pass

