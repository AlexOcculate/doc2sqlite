              img_info.get("xres"),  # XRES
              img_info.get("yres"),  # YRES
              img_info.get("bpc"),  # BPC
              img_info.get("size"),  # SIZE
              digest_hex,  # DIGEST as hex string
              img_info.get("xref"),  # XREF
