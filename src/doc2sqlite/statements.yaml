PageBlock:
  NAME: DBs/MAIN.db

  CLIARG:
    SHORT_HAND: pb
    DEFAULT: true

  DDL:
    DROP: |
      DROP TABLE IF EXISTS
      PAGE_BLOCK

    CREATE: |
      CREATE TABLE IF NOT EXISTS
      PAGE_BLOCK
      ( PAGE_PHYSICAL_NUMBER     INTEGER NOT NULL
      , BLOCK_TYPE_CODE INTEGER
      , BLOCK_TYPE_NAME TEXT
      , BLOCK_NO        INTEGER
      , BLOCK_TEXT      TEXT
      , LOWERED_TEXT    TEXT GENERATED ALWAYS AS (lower(BLOCK_TEXT)) VIRTUAL
      , TEXT_LEN        INTEGER GENERATED ALWAYS AS (length(BLOCK_TEXT)) VIRTUAL
      , X0              REAL
      , Y0              REAL
      , X1              REAL
      , Y1              REAL
      )

  DML:
    INSERT: |
      INSERT INTO 
      PAGE_BLOCK
      ( PAGE_PHYSICAL_NUMBER
      , BLOCK_TYPE_CODE
      , BLOCK_TYPE_NAME
      , BLOCK_NO
      , BLOCK_TEXT
      , X0, Y0, X1, Y1
      ) VALUES ( ?, ?, ?, ?, ?, ?, ?, ?, ? )

  DQL: null

  SCRIPT:
    APPEND: |
      flags = (
          #  If set, then images will be stored in the TextPage.
          #  This causes the presence of (usually large!) binary image content in the
          #  output of text extractions of types:
          #  “blocks”, “dict”, “json”, “rawdict”, “rawjson”, “html”, and “xhtml”
          #  and is the default there.
          #  If used with “blocks” however, only image metadata will be returned,
          #  not the image itself.
          pymupdf.TEXT_PRESERVE_IMAGES
          # | pymupdf.TEXT_COLLECT_VECTORS
          | pymupdf.TEXTFLAGS_BLOCKS
          | pymupdf.TEXT_DEHYPHENATE
          # | pymupdf.TEXTFLAGS_DICT
          | pymupdf.TEXT_COLLECT_STYLES
      )
      # Page level... May include TEXT AND IMAGES.
      # (x0, y0, x1, y1, "lines in the block", block_no, block_type)
      page_blocks: str = page.get_text("blocks", flags=flags, sort=True)

      # dict[str, str]
      for block in page_blocks:

          x0 = y0 = x1 = y1 = block_text = block_no = block_type = None
          x0, y0, x1, y1, block_text, block_no, block_type = block

          entry = (
              page.number,  # 1
              block_type,  # 2
              ({0: "TEXT", 1: "IMAGE"}.get(block_type, "UNKNOWN")),  # 3
              block_no,  # 4
              block_text,  # 5
              x0,  # 6
              y0,  # 7
              x1,  # 8
              y1,  # 9
          )
          self.data.append(entry)

      pass

PageBlockFTS:
  NAME: DBs/MAIN.db

  CLIARG:
    SHORT_HAND: pbfts
    DEFAULT: true

  DDL:
    DROP: |
      DROP TABLE IF EXISTS
      PAGE_BLOCK_FTS

    CREATE: |
      CREATE VIRTUAL TABLE IF NOT EXISTS
      PAGE_BLOCK_FTS
      USING fts5(
        BLOCK_TEXT,
        content='PAGE_BLOCK',
        content_rowid='ROWID'
      )

  DML:
    INSERT: null

    INSERT_INTO: |
      INSERT INTO PAGE_BLOCK_FTS(PAGE_BLOCK_FTS) VALUES('rebuild')

  DQL:
    SELECT: |
      SELECT     T.RANK, T.ROWID, S.PAGE_PHYSICAL_NUMBER, S.BLOCK_NO, S.TEXT_LEN
               , highlight( PAGE_BLOCK_FTS, 0, '<<<', '>>>') AS HIGHLIGHTED
            FROM PAGE_BLOCK_FTS T
      INNER JOIN PAGE_BLOCK S 
              ON T.ROWID = S.ROWID
           WHERE T.BLOCK_TEXT MATCH ?
        ORDER BY T.RANK ASC

