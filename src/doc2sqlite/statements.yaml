      , STYLE        TEXT
      )

  DML:
    INSERT: |
      INSERT INTO 
      DOCUMENT_PAGE_LABEL
      ( STARTPAGE
      , PREFIX
      , FIRSTPAGENUM
      , STYLE
      ) VALUES (?, ?, ?, ?)

  DQL: null

  SCRIPT:
    APPEND: |
      # type: list[{'startpage': int, 'prefix': str, 'style': str, 'firstpagenum': int}]
      page_labels = doc.get_page_labels()

      # {'startpage': int, 'prefix': str, 'style': str, 'firstpagenum': int}
      for pl in page_labels:
          entry = (
              pl["startpage"],  # type: int
              pl["prefix"],  # type: str
              pl["firstpagenum"],  # type: int
              pl.get("style", None),  # type: str
          )
          self.data.append(entry)

DocumentToC:
  NAME: DBs/MAIN.db

  CLIARG:
    SHORT_HAND: dtoc
    DEFAULT: false

  DDL:
    DROP: |
      DROP TABLE IF EXISTS
      DOCUMENT_TOC

    CREATE: |
      CREATE TABLE IF NOT EXISTS
      DOCUMENT_TOC
      ( RID              INTEGER PRIMARY KEY AUTOINCREMENT
      , LEVEL            INTEGER
      , PAGE_1BASED      INTEGER
      , TITLE            TEXT
      , DEST_KIND        INTEGER
      , DEST_KIND_NAME   TEXT
      , DEST_FILE        TEXT
      , DEST_PAGE_0BASED INTEGER
      , DEST_ZOOM        REAL
      , DEST_XREF        INTEGER
      , DEST_VIEW        TEXT
      , DEST_COLOR       TEXT
      , DEST_BOLD        INTEGER
      , DEST_ITALIC      INTEGER
      , DEST_COLLAPSE    INTEGER
      , DEST_NAMEDDEST   TEXT
      , DEST_TO_X        REAL
      , DEST_TO_Y        REAL
      , DEST_RAW         TEXT
      )

  DML:
    INSERT: |
      INSERT INTO 
      DOCUMENT_TOC
      ( LEVEL
      , PAGE_1BASED
      , TITLE
      , DEST_KIND
      , DEST_KIND_NAME
      , DEST_FILE
      , DEST_PAGE_0BASED
      , DEST_ZOOM
      , DEST_XREF
      , DEST_VIEW
      , DEST_COLOR
      , DEST_BOLD
      , DEST_ITALIC
      , DEST_COLLAPSE
      , DEST_NAMEDDEST
      , DEST_TO_X
      , DEST_TO_Y
      , DEST_RAW
      ) VALUES (
        ?, ?, ?, ?, ?,
        ?, ?, ?, ?, ?,
        ?, ?, ?, ?, ?,
        ?, ?, ?
      )

  DQL: null

  SCRIPT:
    APPEND: |
      # type: list[tuple[lvl:int, title:str, page:int, dest:dic[]]]
      toc = doc.get_toc(False)

      LINK_DESTINATION_KINDS = [
          "LINK_NONE",  # 0 – No destination. Indicates a dummy link.
          "LINK_GOTO",  # 1 – Points to a place in this document.
          "LINK_URI",  # 2 – Points to a URI – typically a resource specified with internet syntax.
          # - PyMuPDF treats any external link that contains a colon and does not start
          # with 'file:' as LINK_URI.
          "LINK_LAUNCH",  # 3 – Launch (open) another file (of any “executable” type).
          # - PyMuPDF treats any external link that starts with 'file:' or doesn’t
          #   contain a colon, as LINK_LAUNCH.
          "LINK_NAMED",  # 4 – points to a named location.
          "LINK_GOTOR",  # 5 – Points to a place in another PDF document.
      ]

      for tocEntry in toc:
          level, title, page, dest = tocEntry

          dest_kind = None
          dest_kind_name = None
          dest_file = None
          dest_page_0based = None
          dest_to = None
          dest_zoom = None
          dest_xref = None
          dest_color = None
          dest_view = None
          dest_bold = None
          dest_italic = None
          dest_collapse = None
          dest_nameddest = None
          dest_to_x = None
          dest_to_y = None

          if dest is not None:
              dest_kind = dest.get("kind")
              dest_kind_name = (
                  LINK_DESTINATION_KINDS[dest_kind]
                  if dest_kind is not None and 0 <= dest_kind <= 5
                  else "UNKNOWN"
              )

              dest_file = dest.get("file")
              dest_page_0based = dest.get("page")
              dest_zoom = dest.get("zoom")
              dest_xref = dest.get("xref")
              dest_view = dest.get("view")
              dest_color = str(dest.get("color"))
              dest_bold = dest.get("bold")
              dest_italic = dest.get("italic")
              dest_collapse = dest.get("collapse")
              dest_nameddest = dest.get("nameddest")

              dest_to = dest.get("to")
              if dest_to is not None:
                  dest_to_x = dest_to.x
                  dest_to_y = dest_to.y

          entry = (
              level,  # type: int
              page,  # type: int
              title,  # type: str
              dest_kind,
              dest_kind_name,
              dest_file,
              dest_page_0based,
              dest_zoom,
              dest_xref,
              dest_view,
              dest_color,
              dest_bold,
              dest_italic,
              dest_collapse,
              dest_nameddest,
              dest_to_x,
              dest_to_y,
              str(dest),  # type: str
          )
          self.data.append(entry)

      flush_logger(self.cfg.logger)

