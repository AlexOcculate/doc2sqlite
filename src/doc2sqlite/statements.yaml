    INSERT: |
      INSERT INTO 
      PAGE_IMAGE_INFO
      ( PAGE_PHYSICAL_NUMBER
      , BLOCK_NUMBER
      , BBOX
      , WIDTH
      , HEIGHT
      , CS_NAME
      , COLORSPACE
      , XRES, YRES
      , BPC
