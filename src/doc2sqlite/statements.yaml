PageFont:
  NAME: DBs/MAIN.db

  CLIARG:
    SHORT_HAND: pf
    DEFAULT: true

  DDL:
    DROP: |
      DROP TABLE IF EXISTS
      PAGE_FONT

    CREATE: |
      CREATE TABLE IF NOT EXISTS
      PAGE_FONT
      ( PAGE_PHYSICAL_NUMBER INTEGER NOT NULL
      , XREF        INTEGER
      , EXT         TEXT
      , TYPE        TEXT
      , BASEFONT    TEXT
      , NAME        TEXT
      , ENCODING    TEXT
      , REFERENCER  INTEGER
      )

  DML:
    INSERT: |
      INSERT INTO 
      PAGE_FONT
      ( PAGE_PHYSICAL_NUMBER
      , XREF
      , EXT
      , TYPE
      , BASEFONT
      , NAME
      , ENCODING
      , REFERENCER
      )
      VALUES 
      ( ?, ?, ?, ?, ?, ?, ?, ? )

  DQL: null

  SCRIPT:
    APPEND: |
      # list[ (xref, ext, type, basefont, name, encoding, referencer) ]
      font_list = page.get_fonts(full=True)

      # (xref, ext, type, basefont, name, encoding, referencer)
      for font in font_list:

          xref = ext = type = basefont = name = encoding = referencer = None
          xref, ext, type, basefont, name, encoding, referencer = font

          entry = (
              page.number,
              xref,
              ext,
              type,
              basefont,
              name,
              encoding,
              (  # referencer, default to 0 if missing
                  referencer if len(font) > 6 else 0
              ),
          )
          self.data.append(entry)

      pass

